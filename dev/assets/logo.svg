<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <!--
    CartesianRuns.jl logo
    =====================
    A 3-column × 4-row boolean grid (3 cols = dims 2+, 4 rows = dim 1).
    Each colored rectangle is one Interval (a contiguous run of true cells).
    White hairlines inside a block show individual cell boundaries.
    Outlined squares are false cells (gaps between runs).

    Julia colors
      Blue   #4063D8   col 0, rows 0-1  (2-cell run)
      Green  #389826   col 1, rows 1-3  (3-cell run)
      Purple #9558B2   col 2, row  0    (1-cell run)
      Red    #CB3C33   col 2, rows 2-3  (2-cell run)

    Grid geometry (cell 36 px, gap 8 px, step 44 px)
      cols  x = 38, 82, 126
      rows  y = 16, 60, 104, 148
  -->

  <!-- ── False cells (outlined, no fill) ───────────────────────── -->
  <rect x="38"  y="104" width="36" height="36" rx="5"
        fill="none" stroke="#AAAAAA" stroke-width="1.5"/>
  <rect x="38"  y="148" width="36" height="36" rx="5"
        fill="none" stroke="#AAAAAA" stroke-width="1.5"/>
  <rect x="82"  y="16"  width="36" height="36" rx="5"
        fill="none" stroke="#AAAAAA" stroke-width="1.5"/>
  <rect x="126" y="60"  width="36" height="36" rx="5"
        fill="none" stroke="#AAAAAA" stroke-width="1.5"/>

  <!-- ── Blue run: col 0, rows 0-1 (height 80 = 2×36 + 1×8) ───── -->
  <rect x="38" y="16" width="36" height="80" rx="5" fill="#4063D8"/>
  <!-- cell divider at midpoint of gap: (52+60)/2 = 56 -->
  <line x1="38" y1="56" x2="74" y2="56" stroke="white" stroke-width="2"/>

  <!-- ── Green run: col 1, rows 1-3 (height 124 = 3×36 + 2×8) ─── -->
  <rect x="82" y="60" width="36" height="124" rx="5" fill="#389826"/>
  <!-- dividers at (96+104)/2=100 and (140+148)/2=144 -->
  <line x1="82"  y1="100" x2="118" y2="100" stroke="white" stroke-width="2"/>
  <line x1="82"  y1="144" x2="118" y2="144" stroke="white" stroke-width="2"/>

  <!-- ── Purple run: col 2, row 0 (single cell, no divider) ─────── -->
  <rect x="126" y="16" width="36" height="36" rx="5" fill="#9558B2"/>

  <!-- ── Red run: col 2, rows 2-3 (height 80 = 2×36 + 1×8) ──────── -->
  <rect x="126" y="104" width="36" height="80" rx="5" fill="#CB3C33"/>
  <!-- divider at (140+148)/2=144 -->
  <line x1="126" y1="144" x2="162" y2="144" stroke="white" stroke-width="2"/>

</svg>
